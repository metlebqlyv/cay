<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darçınlı çay ☕</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #ffd6e0 0%, #ffe9d6 50%, #f9d5ff 100%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; color: #5a2a3a;
  }
  .card {
    position: relative; z-index: 2;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(8px);
    border-radius: 28px;
    padding: 36px 28px;
    width: min(92vw, 440px);
    text-align: center;
    box-shadow: 0 20px 50px rgba(180, 70, 110, .25);
  }
  .emoji { font-size: 64px; animation: bob 2.5s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(4deg); } }
  h1 { font-size: 26px; margin: 12px 0 8px; line-height: 1.3; }
  p.sub { opacity: .8; margin-bottom: 24px; }
  .buttons { display: flex; gap: 16px; justify-content: center; align-items: center; min-height: 64px; }
  button {
    font-family: inherit; font-size: 18px; font-weight: 600;
    border: none; border-radius: 999px; padding: 14px 30px; cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  #yes {
    background: linear-gradient(135deg, #ff5c8a, #ff8a5c); color: #fff;
    box-shadow: 0 8px 20px rgba(255, 92, 138, .4);
  }
  #yes:hover { transform: scale(1.06); }
  #no { background: #e9e3e6; color: #6b5560; }
  #no.run { position: fixed; z-index: 10; transition: left .25s ease, top .25s ease; }
  #step2 { display: none; }
  label { display: block; text-align: left; font-weight: 600; margin: 14px 0 6px; }
  input[type=date], input[type=time] {
    width: 100%; padding: 12px 14px; font-size: 17px; font-family: inherit;
    border: 2px solid #ffc2d4; border-radius: 14px; background: #fff; color: #5a2a3a;
    outline: none;
  }
  input:focus { border-color: #ff5c8a; }
  #send { margin-top: 22px; width: 100%; }
  .err { color: #d6336c; font-size: 14px; margin-top: 10px; min-height: 18px; }
  .heart {
    position: fixed; bottom: -40px; z-index: 1; pointer-events: none;
    animation: floatUp linear forwards; opacity: .7;
  }
  @keyframes floatUp { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }
</style>
</head>
<body>

<div class="card">
  <div id="step1">
    <div class="emoji">☕</div>
    <h1>Səninlə bir fincan darçınlı çay içməyə nə deyirsən? 💕</h1>
    <p class="sub">Çay məndən, söhbət səndən 😊</p>
    <div class="buttons" id="btnRow">
      <button id="yes">Bəli 💖</button>
      <button id="no">Xeyr</button>
    </div>
  </div>

  <div id="step2">
    <div class="emoji">🥰</div>
    <h1>Əla! Bəs nə vaxt?</h1>
    <p class="sub">Özünə uyğun gün və saatı seç</p>
    <label for="date">📅 Tarix</label>
    <input type="date" id="date">
    <label for="time">🕐 Saat</label>
    <input type="time" id="time">
    <div class="err" id="err"></div>
    <button id="send">WhatsApp ilə göndər 💌</button>
  </div>
</div>

<script>
const PHONE = "994514538953";
const yes = document.getElementById('yes');
const no = document.getElementById('no');
let yesScale = 1;

// "Xeyr" düyməsi qaçır
function dodge(e) {
  if (e) e.preventDefault();
  no.classList.add('run');
  const w = no.offsetWidth, h = no.offsetHeight;
  const maxX = window.innerWidth - w - 10;
  const maxY = window.innerHeight - h - 10;
  no.style.left = Math.max(10, Math.random() * maxX) + 'px';
  no.style.top = Math.max(10, Math.random() * maxY) + 'px';
  yesScale = Math.min(yesScale + 0.08, 1.6);
  yes.style.transform = 'scale(' + yesScale + ')';
}
['mouseenter', 'mouseover', 'touchstart', 'pointerdown', 'click', 'focus'].forEach(ev =>
  no.addEventListener(ev, dodge, { passive: false })
);
// Kursor yaxınlaşanda da qaçsın
document.addEventListener('mousemove', e => {
  if (!no.classList.contains('run')) return;
  const r = no.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  if (Math.hypot(e.clientX - cx, e.clientY - cy) < 90) dodge();
});

// "Bəli" -> tarix/saat
yes.addEventListener('click', () => {
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
  no.style.display = 'none';
  burst();
});

// Bu gündən əvvəlki tarixləri bağla
const dateEl = document.getElementById('date');
const t = new Date();
dateEl.min = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');

// WhatsApp-a göndər
document.getElementById('send').addEventListener('click', () => {
  const d = dateEl.value, tm = document.getElementById('time').value;
  const err = document.getElementById('err');
  if (!d || !tm) { err.textContent = 'Zəhmət olmasa həm tarix, həm saat seç 🙈'; return; }
  err.textContent = '';
  const [y, m, day] = d.split('-');
  const msg = 'Salam! Darçınlı çay dəvətini qəbul edirəm ☕💕\n' +
              '📅 Tarix: ' + day + '.' + m + '.' + y + '\n' +
              '🕐 Saat: ' + tm;
  window.location.href = 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(msg);
});

// Uçan ürəklər
function heart() {
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = ['💖', '💕', '💗', '🌸', '☕'][Math.floor(Math.random() * 5)];
  h.style.left = Math.random() * 100 + 'vw';
  h.style.fontSize = (16 + Math.random() * 24) + 'px';
  h.style.animationDuration = (5 + Math.random() * 5) + 's';
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 10500);
}
setInterval(heart, 600);
function burst() { for (let i = 0; i < 25; i++) setTimeout(heart, i * 40); }
</script>
</body>
</html>
